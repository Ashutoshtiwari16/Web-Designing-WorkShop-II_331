<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitLife</title>
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- Header -->
  <header class="bg-blue-600 text-white p-4">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-bold">FitLife</h1>
      <nav class="hidden md:flex gap-6">
        <a href="#" class="hover:text-gray-200">Home</a>
        <a href="#" class="hover:text-gray-200">Programs</a>
        <a href="#" class="hover:text-gray-200">Trainers</a>
        <a href="#" class="hover:text-gray-200">Contact</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="text-center p-6 bg-white">
    <h2 class="text-3xl md:text-5xl font-bold mb-4">
      Transform Your Body & Mind
    </h2>
    <p class="text-gray-600 mb-6">
      Join FitLife and start your fitness journey today.
    </p>
    <button class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">
      Get Started
    </button>
  </section>

  <!-- Services Section -->
  <section class="p-6">
    <h2 class="text-2xl font-bold text-center mb-6">Our Programs</h2>

    <!-- Responsive Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <!-- Card 1 -->
      <div class="bg-white p-4 rounded-lg shadow">
        <h3 class="text-xl font-bold mb-2">Gym Training</h3>
        <p class="text-gray-600">Build strength with expert guidance.</p>
      </div>

      <!-- Card 2 -->
      <div class="bg-white p-4 rounded-lg shadow">
        
        <h3 class="text-xl font-bold mb-2">Yoga Classes</h3>
        <p class="text-gray-600">Improve flexibility and mindfulness.</p>
      </div>

      <!-- Card 3 -->
      <div class="bg-white p-4 rounded-lg shadow">
        
        <h3  class="text-xl font-bold mb-2">Cardio Training</h3>
        <p class="text-gray-600">Boost stamina and endurance.</p>
      </div>

    </div>
  </section>

</body>
</html>
